<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Portfolio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap');
:root { --bg-base: #e7e7e7; --content-bg: #ffffff; --text-main: #3c3c3c; --text-sub: #848484; --sys-tab: #a3a3a3; }
body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: var(--bg-base); overflow: hidden; color: var(--text-main); margin:0; text-transform: none !important; }
#public-viewer { display: flex; position: fixed; inset: 0; background: var(--bg-base); z-index: 40; flex-direction: column; padding: 24px 24px 0 24px; }
.tab-container { display: flex; overflow-x: auto; scrollbar-width: none; margin: 0 auto; max-width: 100%; width: 100%; z-index: 10; padding: 16px 20px 0 20px; }
.tab-container::-webkit-scrollbar { display: none; }
.portfolio-tab { padding: 14px 28px 14px 36px; background-color: var(--text-sub); color: #ffffff; font-size: 0.85rem; font-weight: 400; border-radius: 16px 16px 0 0; white-space: nowrap; flex-shrink: 0; transition: all 0.2s ease; min-width: 110px; text-align: center; border:none; cursor:pointer; position: relative; bottom: -1px; margin-left: -20px; box-shadow: 5px 0 12px rgba(0,0,0,0.15); flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; }
.portfolio-tab:first-child { margin-left: 0; padding-left: 28px; }
.portfolio-tab.active { background-color: var(--content-bg); color: var(--text-main); box-shadow: 0 -4px 15px rgba(0,0,0,0.08), 6px 0 15px rgba(0,0,0,0.08); z-index: 10; }
.portfolio-tab.all-tab:not(.active) { background-color: #5c5c5c; }
.portfolio-tab.sys-tab:not(.active) { background-color: var(--sys-tab); }
.book-content { flex: 1; background-color: var(--content-bg); overflow: hidden; position: relative; margin: 0 auto 24px auto; max-width: 100%; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

/* Slide Animations */
.slide-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
.slide { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: flex-start; pointer-events: none; visibility: hidden; z-index: 1; transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
.slide.past { transform: translateX(-100%); pointer-events: none; visibility: hidden; z-index: 1; }
.slide.active { transform: translateX(0); pointer-events: auto; visibility: visible; z-index: 2; }
.slide.future { transform: translateX(100%); pointer-events: none; visibility: hidden; z-index: 1; }

.image-scroll-container::-webkit-scrollbar { width: 4px; height: 4px; }
.image-scroll-container::-webkit-scrollbar-thumb { background: var(--sys-tab); border-radius: 10px; }
.software-tag, .skill-tag { background-color: var(--text-sub); color: #ffffff; padding: 6px 14px; font-size: 11px; font-weight: 500; border-radius: 4px; display: inline-block; text-align: left; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 1px 2px rgba(0,0,0,0.05); flex-shrink: 0; }
.skill-tag-small { background-color: var(--text-sub); color: #ffffff; padding: 3px 8px; font-size: 9px; font-weight: 500; border-radius: 3px; display: inline-block; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 1px 2px rgba(0,0,0,0.05); flex-shrink: 0; }
.timeline-container { position: relative; }
.timeline-line { position: absolute; left: 55px; top: 12px; bottom: 0; width: 1px; background-color: var(--bg-base); z-index: 1; }
.timeline-item { position: relative; display: flex; align-items: flex-start; margin-bottom: 40px; z-index: 2; }
.timeline-item:last-child { margin-bottom: 0; padding-bottom: 40px; }
.timeline-year { width: 45px; font-size: 12px; font-weight: 600; text-align: right; line-height: 1.4; flex-shrink: 0; }
.timeline-dot { position: absolute; left: 55px; transform: translate(-50%, 0); width: 6px; height: 6px; background-color: var(--text-main); border-radius: 50%; top: 7px; z-index: 3; }
.timeline-detail { padding-left: 30px; flex: 1; text-align: left; }
.timeline-heading { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
.timeline-text { font-size: 11px; line-height: 1.8; font-weight: 300; }

@media (max-width: 768px) {
    #public-viewer { padding: 0; } .tab-container { padding: 8px 8px 0 8px; gap: 0; }
    .portfolio-tab { flex: 1 1 0; margin-left: -4px; padding: 10px 2px; min-width: 0; font-size: clamp(8px, 2.2vw, 11px); border-radius: 10px 10px 0 0; box-sizing: border-box; display: flex; justify-content: center; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .portfolio-tab:first-child { margin-left: 0; padding: 10px 2px !important; }
    .timeline-line { left: 40px; } .timeline-dot { left: 40px; top: 5px; } .timeline-year { width: 30px; font-size: 10px; } .timeline-detail { padding-left: 35px; } .book-content { margin: 0; }
}
</style></head>
<body>
<div id="public-viewer">
  <div id="public-tabs" class="tab-container"></div>
  <div class="book-content relative" id="swipe-area" style="touch-action: pan-y pinch-zoom;">
    <div id="password-gate" class="hidden absolute inset-0 z-[100] flex items-center justify-center bg-white">
      <div class="text-center space-y-8 max-w-xs w-full px-6 flex flex-col items-center">
        <h2 class="text-base font-medium tracking-wide whitespace-nowrap">パスワードを入力してください。</h2>
        <input type="password" id="viewer-password-input" class="border rounded-lg p-4 text-center text-sm outline-none w-full bg-[#e7e7e7]">
        <button onclick="checkPassword()" class="text-[var(--text-main)] py-4 rounded-lg text-sm font-light tracking-widest w-full bg-gray-200">閲覧する</button>
        <p id="password-error" class="text-[10px] text-red-400 opacity-0 transition-opacity">パスワードが正しくありません</p>
      </div>
    </div>
    
    <div class="absolute top-4 left-1/2 -translate-x-1/2 md:top-8 md:right-8 md:translate-x-0 md:left-auto text-[10px] font-mono tracking-[0.3em] text-[var(--text-sub)] z-50 cursor-pointer hover:text-[var(--text-main)] transition-colors" onclick="openThumbnails()" title="ページ一覧を表示">
        <span id="page-counter">00 / 00</span>
    </div>

    <div id="slide-wrapper" class="slide-container h-full"></div>
    
    <div class="absolute inset-y-0 left-0 w-12 md:w-24 flex items-center justify-center cursor-pointer z-40" onclick="prevSlide()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3c3c3c" stroke-width="1" opacity="0.6"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
    <div class="absolute inset-y-0 right-0 w-12 md:w-24 flex items-center justify-center cursor-pointer z-40" onclick="nextSlide()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3c3c3c" stroke-width="1" opacity="0.6"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
  </div>
</div>

<div id="thumbnail-overlay" class="fixed inset-0 bg-black/20 z-[140] hidden opacity-0 transition-opacity duration-300 backdrop-blur-[2px] cursor-pointer" onclick="closeThumbnails()"></div>
<div id="thumbnail-drawer" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md z-[150] transform translate-y-full transition-transform duration-300 shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
    <div class="px-6 py-4 flex justify-end items-center">
        <button onclick="closeThumbnails()" class="text-[var(--text-sub)] hover:text-black transition-colors"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    </div>
    <div id="thumbnail-list" class="flex gap-6 p-6 overflow-x-auto image-scroll-container items-start"></div>
</div>

<div id="lightbox-modal" class="fixed inset-0 z-[200] hidden bg-white/95 flex items-center justify-center p-4 cursor-zoom-out" onclick="closeLightbox()"><div id="lightbox-content-wrapper" class="w-full h-full flex items-center justify-center"></div></div>

    const pSkill = (profileData.practicalSkills || []).filter(s => s.name && s.name.trim() !== '').map(s => `<div class="skill-tag">${s.name}</div>`).join('');
    const lSkill = (profileData.learningSkills || []).filter(s => s.name && s.name.trim() !== '').map(s => `<div class="skill-tag-small">${s.name}</div>`).join('');
    const career = (profileData.career || []).map(c => `<div class="timeline-item"><div class="timeline-year">${c.year}</div><div class="timeline-dot"></div><div class="timeline-detail"><div class="timeline-heading break-words">${c.title}</div><p class="timeline-text whitespace-pre-wrap break-words">${c.detail}</p></div></div>`).join('');
    const intro = profileData.introText ? `<div class="text-[13px] font-medium text-[var(--text-main)] mt-6 leading-relaxed whitespace-pre-wrap break-words text-left">${profileData.introText}</div>` : '';

    const skillHtml = `
        <div class="mb-4">
            <h3 class="text-[9px] font-semibold w-full bg-[var(--sys-tab)]/50 text-white px-2 py-[1px] mb-4 text-left shadow-sm inline-block">Skill</h3>
            <div class="flex flex-col gap-4">
                <div>
                    <div class="text-[9px] font-semibold tracking-[0.2em] text-[var(--text-sub)] uppercase mb-2 text-left">実務経験あり</div>
                    <div class="flex flex-wrap justify-start gap-2">${pSkill}</div>
                </div>
                <div>
                    <div class="text-[9px] font-semibold tracking-[0.2em] text-[var(--text-sub)] uppercase mb-2 text-left">実務経験なし</div>
                    <div class="flex flex-wrap justify-start gap-1.5">${lSkill}</div>
                </div>
            </div>
        </div>
    `;

    const pc = `<div class="hidden md:grid md:grid-cols-2 w-full h-full overflow-hidden"><div class="pt-16 pb-12 pl-28 pr-12 lg:pt-24 lg:pb-16 lg:pl-40 overflow-y-auto image-scroll-container flex flex-col justify-start"><div class="w-full max-w-lg ml-auto flex flex-col h-full"><div class="mb-12 text-left"><h2 class="text-3xl font-semibold tracking-widest text-[var(--text-main)] mb-1">${profileData.name || 'NAME'}</h2><div class="text-[10px] font-medium tracking-[0.3em] text-[var(--text-sub)]">${profileData.reading || 'PROFILE'}</div>${intro}</div><div class="mt-auto border-t-0 pt-0 text-left">${skillHtml}</div></div></div><div class="pt-16 pb-12 pl-12 pr-28 lg:pt-24 lg:pb-20 lg:pr-40 overflow-y-auto image-scroll-container border-l border-[var(--bg-base)]"><div class="timeline-container w-full max-w-lg mr-auto"><div class="timeline-line"></div>${career}</div></div></div>`;

    const sp = `<div class="flex flex-col md:hidden w-full h-full overflow-y-auto image-scroll-container px-12 pb-12"><div class="pt-24 pb-9 text-left"><h2 class="text-2xl font-semibold tracking-widest mb-1">${profileData.name || 'NAME'}</h2><div class="text-[10px] font-medium tracking-[0.3em] text-[var(--text-sub)]">${profileData.reading || 'PROFILE'}</div>${intro}</div><div class="pt-9 pb-9 border-t border-[var(--bg-base)] text-left">${skillHtml}</div><div class="pt-9 mt-0 border-t border-[var(--bg-base)]"><div class="timeline-container w-full"><div class="timeline-line"></div>${career}</div></div></div>`;

    return `<div class="w-full h-full relative slide-inner">${pc}${sp}</div>`;
}

function getWorkHtml(item) {
    const mainHtml = (item.images || []).map((img, idx, arr) => {
        const mbClass = (idx === arr.length - 1 && item.materials?.length > 0) ? 'mb-12 md:mb-10' : 'mb-6 md:mb-12';
        let mediaHtml = '';
        if (Array.isArray(img.data)) {
            let gridInner = img.data.map(d => `<div class="aspect-[4/3] w-full">${getMediaRenderHtml(d, 'w-full h-full object-cover border border-[var(--bg-base)] cursor-zoom-in', 'openLightbox(this.src)')}</div>`).join('');
            mediaHtml = `<div class="grid grid-cols-2 gap-4">${gridInner}</div>`;
        } else {
            mediaHtml = getMediaRenderHtml(img.data, 'w-full border border-[var(--bg-base)] cursor-zoom-in', 'openLightbox(this.src)');
        }
        return `<div class="${mbClass} slide-inner text-left">${img.label ? `<div class="text-[9px] font-semibold tracking-[0.2em] mb-2 text-[var(--text-sub)]">${img.label}</div>` : ''}${mediaHtml}</div>`;
    }).join('');
    
    const matHtml = (item.materials || []).map((img, idx) => {
        let prefix = idx === 0 ? '<div class="border-t border-[var(--bg-base)] pt-8 md:pt-10 w-full mb-8"></div>' : '<div class="mt-6 w-full"></div>';
        let mediaHtml = '';
        if (Array.isArray(img.data)) {
            let gridInner = img.data.map(d => `<div class="aspect-[4/3] w-full">${getMediaRenderHtml(d, 'w-full h-full object-cover border border-[var(--bg-base)] cursor-zoom-in', 'openLightbox(this.src)')}</div>`).join('');
            mediaHtml = `<div class="grid grid-cols-2 gap-4">${gridInner}</div>`;
        } else {
            mediaHtml = getMediaRenderHtml(img.data, 'w-full border border-[var(--bg-base)] cursor-zoom-in', 'openLightbox(this.src)');
        }
        return `${prefix}<div class="slide-inner text-left"><div class="text-[9px] font-semibold tracking-[0.3em] mb-2 text-[var(--text-sub)] break-words">${img.type}</div>${mediaHtml}</div>`;
    }).join('');

    return `<div class="w-full flex flex-col md:grid md:grid-cols-2 h-full overflow-y-auto md:overflow-hidden slide-inner image-scroll-container"><div class="order-2 md:order-1 pt-9 pb-8 px-12 md:pl-28 md:pr-12 lg:pl-40 lg:pr-12 md:pt-16 lg:pt-24 md:overflow-y-auto md:image-scroll-container border-t md:border-t-0 border-[var(--bg-base)]"><div class="w-full md:max-w-2xl md:ml-auto">${mainHtml}${matHtml}</div></div><div class="order-1 md:order-2 pt-24 pb-9 px-12 md:pl-12 md:pr-28 lg:pl-12 lg:pr-40 md:pt-16 lg:pt-24 flex flex-col justify-start md:overflow-y-auto md:image-scroll-container md:border-l border-[var(--bg-base)] shrink-0"><div class="w-full md:max-w-lg md:mr-auto flex flex-col flex-1 h-full"><div class="mb-0 md:mt-[22px] text-left"><h2 class="text-xl md:text-2xl font-semibold mb-5 break-words">${item.title}</h2><div class="text-sm font-medium mb-5 whitespace-pre-wrap break-words">${item.issue || ''}</div><p class="text-[11px] font-light leading-loose whitespace-pre-wrap break-words">${item.description}</p></div><div class="mt-6 md:mt-auto pt-6 border-t border-[var(--bg-base)] text-left"><div class="flex flex-wrap gap-2 mb-4 justify-start">${(item.software || []).map(sw => `<div class="software-tag">${sw}</div>`).join('')}</div><div class="space-y-2"><div class="text-[9px] font-semibold tracking-widest text-[var(--text-sub)] break-words">${(item.roles || []).join(' / ')}</div><div class="font-mono text-[10px] text-[var(--text-sub)]">${item.date}</div></div></div></div></div></div>`;
}

function getOthersHtml() {
    const listHtml = (othersItems || []).map(item => {
        const img = item.image ? getMediaRenderHtml(item.image, 'w-full mt-9 md:mt-12 border border-[var(--bg-base)] cursor-zoom-in', 'openLightbox(this.src)') : '';
        return `<div class="slide-inner mb-12 md:mb-20 text-left"><h3 class="text-sm font-semibold tracking-widest border-l-2 border-[var(--text-main)] pl-4 mb-6 whitespace-pre-wrap break-words">${item.title}</h3><p class="text-[11px] leading-loose whitespace-pre-wrap font-light break-words">${item.desc}</p>${img}</div>`;
    }).join('');
    return `<div class="w-full h-full overflow-hidden slide-inner"><div class="w-full h-full pt-24 md:pt-16 lg:pt-24 pb-12 px-12 md:px-20 lg:px-40 overflow-y-auto image-scroll-container"><div class="w-full md:max-w-3xl mx-auto pb-8">${listHtml}</div></div></div>`;
}

function setActiveTab(tab) { currentTab = tab; currentSlide = 0; renderTabs(); initSlides(); }

function renderTabs() {
    const container = document.getElementById('public-tabs'); container.innerHTML = "";
    const tabsData = [{ label: "All", isActive: currentTab === 'ALL', onClick: () => setActiveTab('ALL') }];
    [...new Set(portfolioItems.map(i => i.genre))].forEach(g => tabsData.push({ label: g, isActive: currentTab === g, onClick: () => setActiveTab(g) }));
    if(othersItems.length > 0) tabsData.push({ label: "Operations", isActive: currentTab === 'OTHERS', onClick: () => setActiveTab('OTHERS') });
    tabsData.push({ label: "Profile", isActive: currentTab === 'PROFILE', onClick: () => setActiveTab('PROFILE') });
    tabsData.forEach((td, i) => {
        const btn = document.createElement('button'); btn.innerText = td.label; btn.onclick = td.onClick;
        btn.className = 'portfolio-tab ' + (td.isActive ? 'active ' : '') + (td.label==='All'?'all-tab':(td.label==='Operations'||td.label==='Profile'?'sys-tab':''));
        btn.style.zIndex = td.isActive ? 20 : (tabsData.length - i); container.appendChild(btn);
    });
}

function initSlides() {
    const wrapper = document.getElementById('slide-wrapper'); wrapper.innerHTML = "";
    window.slidesData = [];
    
    let sortedWorks = [...portfolioItems];
    
    if(currentTab === 'ALL') { 
        window.slidesData.push({t:'p'}); 
        sortedWorks.forEach(i=>window.slidesData.push({t:'w',d:i})); 
        if(othersItems.length) window.slidesData.push({t:'o'}); 
    }
    else if(currentTab==='PROFILE') window.slidesData.push({t:'p'}); 
    else if(currentTab==='OTHERS') window.slidesData.push({t:'o'});
    else sortedWorks.filter(i=>i.genre===currentTab).forEach(i=>window.slidesData.push({t:'w',d:i}));
    
    window.slidesData.forEach((s, i) => {
        const div = document.createElement('div'); 
        div.className = 'slide ' + (i === 0 ? 'active' : 'future');
        if(i === 0) { div.style.visibility = 'visible'; div.style.zIndex = '2'; }
        if(s.t==='p') div.innerHTML = getProfileHtml(); else if(s.t==='o') div.innerHTML = getOthersHtml(); else div.innerHTML = getWorkHtml(s.d);
        wrapper.appendChild(div);
    });
    
    currentSlide = 0;
    updateCounter();
}

function updateCounter() {
    const cEl = document.getElementById('page-counter');
    if(cEl) cEl.innerText = (window.slidesData.length ? currentSlide + 1 : 0).toString().padStart(2, '0') + ' / ' + window.slidesData.length.toString().padStart(2, '0');
    
    if (document.getElementById('thumbnail-drawer') && !document.getElementById('thumbnail-drawer').classList.contains('translate-y-full')) {
        renderThumbnails();
    }
}

function goToSlide(newIndex, direction) {
    const slides = document.querySelectorAll('.slide');
    if (slides.length <= 1 || newIndex === currentSlide || isAnimating) return;
    
    isAnimating = true;
    if (!direction) direction = newIndex > currentSlide ? 'next' : 'prev';
    
    const oldIndex = currentSlide;
    currentSlide = newIndex;
    
    slides.forEach((slide, i) => {
        slide.style.transition = 'none'; 
        if (i === newIndex) {
            slide.className = 'slide ' + (direction === 'next' ? 'future' : 'past');
            slide.style.visibility = 'visible';
            slide.style.zIndex = '3';
        } else if (i === oldIndex) {
            slide.className = 'slide active';
            slide.style.visibility = 'visible';
            slide.style.zIndex = '2';
        } else {
            slide.className = 'slide ' + (direction === 'next' ? 'past' : 'future');
            slide.style.visibility = 'hidden';
            slide.style.zIndex = '1';
        }
    });
    
    void document.body.offsetWidth; 
    
    slides.forEach((slide, i) => {
        slide.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
        if (i === newIndex) {
            slide.className = 'slide active';
        } else if (i === oldIndex) {
            slide.className = 'slide ' + (direction === 'next' ? 'past' : 'future');
        }
    });
    
    updateCounter();
    
    setTimeout(() => {
        slides.forEach((slide, i) => {
            if (i !== currentSlide) slide.style.visibility = '';
            slide.style.zIndex = '';
        });
        isAnimating = false;
    }, 500);
}

function jumpToSlide(idx) { 
    if (idx !== currentSlide) goToSlide(idx, idx > currentSlide ? 'next' : 'prev'); 
}

function renderThumbnails() {
    const list = document.getElementById('thumbnail-list'); if (!list) return; list.innerHTML = "";
    
    window.slidesData.forEach((s, i) => {
        if (s.t === 'p' || s.t === 'o') return;
        let img = "";
        if (s.d.images && s.d.images.length > 0) {
            img = Array.isArray(s.d.images[0].data) ? s.d.images[0].data[0] : s.d.images[0].data;
        }
        let imgTag = img ? getMediaRenderHtml(img, 'w-full h-full object-cover rounded shadow-sm') : `<div class="w-full h-full bg-[#f2f2f2] flex items-center justify-center text-[10px] text-[var(--text-sub)] font-bold tracking-widest">NO IMG</div>`;
        const ring = i === currentSlide ? "ring-2 ring-[var(--text-main)] ring-offset-2 opacity-100" : "opacity-60 hover:opacity-100 transition-opacity";
        const el = document.createElement('div'); el.className = "flex-shrink-0 w-28 md:w-36 cursor-pointer flex flex-col items-center group";
        el.onclick = () => { jumpToSlide(i); };
        el.innerHTML = `<div class="w-full aspect-[4/3] rounded bg-gray-100 relative ${ring}">${imgTag}<div class="absolute top-1 left-1 bg-black/50 text-white text-[9px] px-1.5 py-0.5 rounded font-mono">${String(i+1).padStart(2, '0')}</div></div>`;
        list.appendChild(el);
    });

    setTimeout(() => {
        const activeEl = list.querySelector('.ring-2');
        if(activeEl && activeEl.parentElement) activeEl.parentElement.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }, 50);
}

function openThumbnails() { 
    renderThumbnails(); 
    document.getElementById('thumbnail-overlay').classList.remove('hidden'); 
    setTimeout(() => { 
        document.getElementById('thumbnail-overlay').classList.remove('opacity-0'); 
        document.getElementById('thumbnail-overlay').classList.add('opacity-100'); 
        document.getElementById('thumbnail-drawer').classList.remove('translate-y-full'); 
        document.getElementById('thumbnail-drawer').classList.add('translate-y-0'); 
    }, 10); 
}

function closeThumbnails() { 
    document.getElementById('thumbnail-overlay').classList.remove('opacity-100'); 
    document.getElementById('thumbnail-overlay').classList.add('opacity-0'); 
    document.getElementById('thumbnail-drawer').classList.remove('translate-y-0'); 
    document.getElementById('thumbnail-drawer').classList.add('translate-y-full'); 
    setTimeout(() => { document.getElementById('thumbnail-overlay').classList.add('hidden'); }, 300); 
}

function nextSlide() { const len = window.slidesData.length; if (len > 1) goToSlide((currentSlide + 1) % len, 'next'); }
function prevSlide() { const len = window.slidesData.length; if (len > 1) goToSlide((currentSlide - 1 + len) % len, 'prev'); }

function openLightbox(s) { 
    const wrapper = document.getElementById('lightbox-content-wrapper');
    if(s.startsWith('data:video/')) {
        wrapper.innerHTML = `<video src="${s}" class="max-w-full max-h-full object-contain drop-shadow-2xl" controls autoplay loop playsinline></video>`;
    } else {
        wrapper.innerHTML = `<img src="${s}" class="max-w-full max-h-full object-contain drop-shadow-2xl">`;
    }
    document.getElementById('lightbox-modal').classList.remove('hidden'); 
}
function closeLightbox() { 
    document.getElementById('lightbox-modal').classList.add('hidden'); 
    document.getElementById('lightbox-content-wrapper').innerHTML = '';
}
function safeDecode(b) { if(!b || b==="INJECT_B64_PAYLOAD") return ""; return decodeURIComponent(escape(atob(b))); }

let touchStartX = 0;
let touchStartY = 0;
document.getElementById('swipe-area').addEventListener('touchstart', e => { 
    touchStartX = e.changedTouches[0].screenX; 
    touchStartY = e.changedTouches[0].screenY;
}, {passive: true});
document.getElementById('swipe-area').addEventListener('touchend', e => {
    let touchEndX = e.changedTouches[0].screenX;
    let touchEndY = e.changedTouches[0].screenY;
    if (Math.abs(touchEndY - touchStartY) > 50) return; 
    if (touchEndX < touchStartX - 50) nextSlide();
    if (touchEndX > touchStartX + 50) prevSlide();
}, {passive: true});

window.onload = () => {
    if(hasPassword) document.getElementById("password-gate").classList.remove("hidden");
    else { const r = safeDecode(b64Payload); if(r) { const d = JSON.parse(r); portfolioItems = d.portfolioItems||[]; othersItems = d.othersItems||[]; profileData = d.profileData||{}; document.title = (profileData.name || "Portfolio") + " Portfolio"; } setActiveTab("ALL"); }
};

function checkPassword() {
    const input = document.getElementById("viewer-password-input");
    try { 
        const raw = safeDecode(b64Payload); 
        const bytes = CryptoJS.AES.decrypt(raw, input.value.trim()); 
        const dec = bytes.toString(CryptoJS.enc.Utf8); 
        if(!dec) throw new Error(); 
        const d = JSON.parse(dec); 
        portfolioItems = d.portfolioItems||[]; 
        othersItems = d.othersItems||[]; 
        profileData = d.profileData||{}; 
        document.getElementById("password-gate").classList.add("hidden"); 
        setActiveTab("ALL"); 
    } catch(e) { 
        document.getElementById("password-error").style.opacity = 1; 
        input.value = ""; 
    }
}
